<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOMi - Live Voice Room & Firebase Realtime Direct Messaging</title>
    <!-- مكتبة PeerJS للصوت المباشر -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #07090E;
            color: #FFFFFF;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .svg-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        .aurora-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #07090E 100%);
            filter: blur(40px);
        }

        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            max-width: 440px;
            background: #0D1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        .card-container.clean-mode {
            background: #07090E !important;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(25px);
            padding: 20px 16px 0px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .top-header-actions-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
        }

        .logout-small-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #EF4444;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .logout-small-btn svg {
            width: 16px;
            height: 16px;
            stroke: #FFFFFF;
            stroke-width: 2.2;
            fill: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 5px;
            transition: all 0.3s ease;
        }

        .logo-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #EF4444 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #9CA3AF;
            margin-top: 4px;
            font-weight: 700;
        }

        .view-step {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .hidden-view {
            display: none !important;
        }

        .active-view {
            display: flex;
            animation: viewEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 16px 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
        }

        .input-box label {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .input-box input:focus,
        .input-box input:not(:placeholder-shown) {
            border-color: #EF4444;
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: 10px;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
        }

        .auth-error {
            color: #EF4444;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .gender-title, .step-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .gender-subtitle, .step-subtitle {
            text-align: center;
            font-size: 13px;
            color: #9CA3AF;
            margin-bottom: 20px;
        }

        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .gender-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gender-card .gender-symbol-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            stroke-width: 2.5;
            fill: none;
            transition: all 0.3s ease;
        }

        .gender-card#cardMale .gender-symbol-icon { stroke: #3B82F6; }
        .gender-card#cardFemale .gender-symbol-icon { stroke: #EC4899; }

        .gender-card.selected {
            background: rgba(239, 68, 68, 0.12);
            border-color: #EF4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .gender-card .checkmark {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #EF4444;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
        }

        .gender-card.selected .checkmark { opacity: 1; }

        .name-field-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .name-input {
            width: 100%;
            padding: 20px 48px 20px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            outline: none;
        }

        .name-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }

        .status-check {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            color: #10B981;
            font-size: 20px;
            transition: transform 0.3s;
        }

        .name-field-wrapper.valid .status-check {
            transform: translateY(-50%) scale(1);
        }

        .counter-tag {
            text-align: left;
            font-size: 11px;
            color: #6B7280;
            margin-bottom: 20px;
            padding-left: 6px;
        }

        .date-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .date-select-wrapper select {
            width: 100%;
            padding: 14px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            text-align: center;
        }

        .date-select-wrapper select option { background: #0D1117; color: #FFFFFF; }

        .date-label {
            display: block;
            text-align: center;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .age-badge {
            text-align: center;
            margin-bottom: 16px;
            font-size: 12px;
            color: #10B981;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .age-badge.show { opacity: 1; }

        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-upload-zone {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(245, 158, 11, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .avatar-upload-zone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .upload-placeholder-content { text-align: center; pointer-events: none; }
        .upload-icon { font-size: 26px; margin-bottom: 4px; display: block; }
        .upload-text { font-size: 11px; color: #9CA3AF; font-weight: 700; }
        #avatarInput, #roomAvatarInput, #roomBgInput, #profileAvatarInput { display: none; }

        .gold-card-wrapper {
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .gold-id-card {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 18px;
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            padding: 18px;
            box-shadow: 0 15px 35px rgba(170, 119, 28, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-chip {
            width: 34px;
            height: 24px;
            background: linear-gradient(135deg, #E6C687 0%, #99742B 100%);
            border-radius: 5px;
        }

        .card-brand-tag {
            font-size: 13px;
            font-weight: 900;
            color: #382506;
            letter-spacing: 2px;
        }

        .card-body-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-avatar-box {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid #FFF;
            overflow: hidden;
            background: #222;
            flex-shrink: 0;
        }

        .card-avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .card-name {
            font-size: 17px;
            font-weight: 900;
            color: #2b1c03;
        }

        .card-info-grid {
            font-size: 11px;
            color: #4a3307;
            font-weight: 700;
            margin-top: 3px;
        }

        .card-footer-row {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #5c4109;
            font-weight: 800;
            border-top: 1px solid rgba(110, 78, 13, 0.2);
            padding-top: 6px;
        }

        .btn-wrapper { position: relative; margin-top: 10px; width: 100%; }

        .magnetic-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .footer-tag { text-align: center; margin-top: auto; padding: 12px 0; font-size: 11px; color: #4B5563; }

        .top-global-search-box {
            display: none;
            gap: 8px;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .id-search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .id-search-input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }

        .search-icon-inside {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #F59E0B;
        }

        .id-search-btn {
            padding: 12px 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border: none;
            color: #07090E;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .user-profile-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 250;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .user-profile-modal-overlay.active { display: flex; }

        .searched-profile-card {
            background: #131722;
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .searched-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #F59E0B;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .searched-name { font-size: 18px; font-weight: 900; color: #FFF; margin-bottom: 4px; }
        .searched-id-tag { font-size: 13px; color: #F59E0B; font-weight: 800; margin-bottom: 14px; }

        .searched-details-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #9CA3AF;
            display: flex;
            justify-content: space-around;
            margin-bottom: 14px;
        }

        .profile-action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .send-direct-msg-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border: none;
            border-radius: 12px;
            color: #FFF;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .close-searched-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #FFF;
            font-weight: 800;
            cursor: pointer;
        }

        .create-room-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #07090E;
            font-size: 15px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .create-room-btn svg { width: 20px; height: 20px; stroke: #07090E; stroke-width: 2.2; fill: none; }

        /* DIRECT MESSAGES STYLING */
        .dm-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
        }

        .dm-header-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dm-header-badge img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #F59E0B;
            object-fit: cover;
        }

        .dm-header-title {
            font-size: 14px;
            font-weight: 800;
            color: #FFF;
        }

        .dm-header-sub {
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
        }

        .dm-chat-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dm-msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            word-break: break-word;
        }

        .dm-msg-bubble.me {
            align-self: flex-start;
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            color: #FFF;
            border-bottom-right-radius: 4px;
        }

        .dm-msg-bubble.other {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            color: #FFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 4px;
        }

        .dm-no-chat-text {
            text-align: center;
            color: #6B7280;
            font-size: 13px;
            margin: auto;
            font-weight: 700;
        }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 100;
            display: none; justify-content: flex-end; flex-direction: column;
        }
        .modal-overlay.active { display: flex; }

        .action-sheet {
            background: #131722; border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 20px 20px 30px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; gap: 12px;
        }

        .profile-card { display: flex; flex-direction: column; align-items: center; width: 100%; padding-bottom: 20px; }
        .profile-img-large {
            position: relative; width: 90px; height: 90px; border-radius: 50%;
            border: 3px solid #F59E0B; overflow: hidden; margin-bottom: 12px; background: #222; cursor: pointer;
        }
        .profile-img-large img { width: 100%; height: 100%; object-fit: cover; }

        .bottom-nav-bar {
            width: calc(100% + 32px); margin-left: -16px; margin-right: -16px; height: 65px;
            background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-around; align-items: center; z-index: 20; margin-top: auto; flex-shrink: 0;
        }
        .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #6B7280; cursor: pointer; gap: 4px; }
        .nav-btn.active { color: #F59E0B; font-weight: 800; }
        .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="card-container" id="cardContainer">
        <div class="glass-card" id="card">
            
            <div class="top-header-actions-bar" id="topHeaderBar" style="display: none;">
                <button type="button" class="logout-small-btn" onclick="handleFullLogout()">
                    <span>تسجيل الخروج</span>
                </button>
            </div>

            <div class="brand" id="mainBrandHeader">
                <div class="logo-title">SIMOMi</div>
                <div class="subtitle">دردشـة صـوتـيـة مـبـاشـرة</div>
            </div>

            <div class="top-global-search-box" id="globalSearchBox">
                <div class="id-search-input-wrapper">
                    <input type="number" id="searchUserIdInput" class="id-search-input" placeholder="بحث بـ ID المستخدم (7 أرقام)..." autocomplete="off">
                </div>
                <button type="button" class="id-search-btn" onclick="searchUserById()">بحث 🔍</button>
            </div>

            <!-- STEP 1: Login -->
            <div id="loginView" class="view-step active-view">
                <form onsubmit="handleLoginSubmit(event)">
                    <div class="input-box">
                        <input type="email" id="email" placeholder=" " required autocomplete="off">
                        <label for="email">البريد الإلكتروني</label>
                    </div>
                    <div class="input-box">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">كلمة المرور</label>
                    </div>
                    <div id="authError" class="auth-error"></div>
                    <div class="btn-wrapper">
                        <button type="submit" id="loginBtn" class="magnetic-btn">تسجيل الدخول / إنشيء حسابك</button>
                    </div>
                </form>
            </div>

            <!-- STEP 7: Home Dashboard -->
            <div id="homeMainView" class="view-step hidden-view">
                <button type="button" class="create-room-btn" onclick="goToStep('createRoomView')">
                    <span>إنشاء غرفة دردشة صوتية</span>
                </button>
            </div>

            <!-- SEARCH PROFILE MODAL -->
            <div class="user-profile-modal-overlay" id="searchProfileModal">
                <div class="searched-profile-card">
                    <img id="searchedAvatarImg" class="searched-avatar" src="https://via.placeholder.com/150" alt="Avatar">
                    <div class="searched-name" id="searchedNameTxt">الاسم</div>
                    <div class="searched-id-tag" id="searchedIdTxt">ID: 0000000</div>
                    <div class="profile-action-btns">
                        <button type="button" class="send-direct-msg-btn" onclick="openDirectMessageFromProfile()">
                            💬 إرسال رسالة خاصة
                        </button>
                        <button type="button" class="close-searched-btn" onclick="closeSearchModal()">إغلاق</button>
                    </div>
                </div>
            </div>

            <!-- MESSAGES VIEW (Firebase Connected) -->
            <div id="messagesView" class="view-step hidden-view">
                <div class="dm-container">
                    <div class="dm-header-badge" id="dmHeaderBadge">
                        <img id="dmUserAvatar" src="https://via.placeholder.com/150" alt="Avatar">
                        <div>
                            <div class="dm-header-title" id="dmUserName">حدد مستخدماً للمحادثة</div>
                            <div class="dm-header-sub" id="dmUserId">ID: -</div>
                        </div>
                    </div>

                    <div class="dm-chat-box" id="dmChatBox">
                        <div class="dm-no-chat-text" id="dmNoChatTxt">ابحث عن مستخدم عبر ID واضغط على "إرسال رسالة" لبدء المحادثة معه!</div>
                    </div>

                    <div style="display:flex; gap:8px;">
                        <input type="text" id="dmInputMsg" class="id-search-input" placeholder="اكتب رسالة خاصة..." autocomplete="off">
                        <button type="button" class="id-search-btn" onclick="sendDirectMessage()">إرسال 🚀</button>
                    </div>
                </div>
            </div>

            <!-- BOTTOM NAVIGATION -->
            <div class="bottom-nav-bar" id="bottomNav" style="display: none;">
                <div class="nav-btn active" id="navHomeBtn" onclick="switchTab('home')"><span>الرئيسية</span></div>
                <div class="nav-btn" id="navMsgBtn" onclick="switchTab('messages')"><span>رسائل</span></div>
                <div class="nav-btn" id="navProfileBtn" onclick="switchTab('profile')"><span>حسابي</span></div>
            </div>

            <div class="footer-tag">SIMOMi Engine v2.0 • Firebase Realtime Sync</div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARBm97R3Xu8fuyVvkSYJh5OLbFE0Id1Hs",
            authDomain: "simoni-85d16.firebaseapp.com",
            projectId: "simoni-85d16",
            storageBucket: "simoni-85d16.firebasestorage.app",
            messagingSenderId: "254262974921",
            appId: "1:254262974921:web:fe4ba7afd9c4341a8f3018"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.db = getFirestore(app);
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.collection = collection;
        window.addDoc = addDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.onSnapshot = onSnapshot;
    </script>

    <script>
        const userData = { id: '', name: '', avatarSrc: '' };
        let searchedTargetUser = null;
        let activeDMUser = null;
        let unsubscribeMessages = null;

        function getChatRoomId(id1, id2) {
            return [id1, id2].sort().join("_");
        }

        async function openDirectMessageFromProfile() {
            if (!searchedTargetUser) return;
            activeDMUser = searchedTargetUser;
            closeSearchModal();

            document.getElementById('dmUserName').innerText = activeDMUser.name || 'مستخدم';
            document.getElementById('dmUserId').innerText = 'ID: ' + activeDMUser.id;
            document.getElementById('dmUserAvatar').src = activeDMUser.avatarSrc || 'https://via.placeholder.com/150';

            listenToRealtimeMessages();
            switchTab('messages');
        }

        // الاستماع للرسائل الحقيقية المباشرة من Firebase
        function listenToRealtimeMessages() {
            if (!activeDMUser || !userData.id) return;
            const chatRoomId = getChatRoomId(userData.id, activeDMUser.id);
            const chatBox = document.getElementById('dmChatBox');
            
            if (unsubscribeMessages) unsubscribeMessages();

            const q = window.query(
                window.collection(window.db, "direct_messages", chatRoomId, "messages"),
                window.orderBy("timestamp", "asc")
            );

            unsubscribeMessages = window.onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                if (snapshot.empty) {
                    chatBox.innerHTML = `<div class="dm-no-chat-text">لا توجد رسائل بينكما بعد.. أرسل أول سلام! 👋</div>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === userData.id;
                    chatBox.innerHTML += `<div class="dm-msg-bubble ${isMe ? 'me' : 'other'}">${msg.text}</div>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        async function sendDirectMessage() {
            const msgInput = document.getElementById('dmInputMsg');
            const msgText = msgInput.value.trim();
            if (!msgText || !activeDMUser || !userData.id) return;

            const chatRoomId = getChatRoomId(userData.id, activeDMUser.id);

            try {
                await window.addDoc(window.collection(window.db, "direct_messages", chatRoomId, "messages"), {
                    senderId: userData.id,
                    receiverId: activeDMUser.id,
                    text: msgText,
                    timestamp: new Date()
                });
                msgInput.value = '';
            } catch(e) {
                alert('خطأ في إرسال الرسالة، حاول مرة أخرى');
            }
        }

        function closeSearchModal() { document.getElementById('searchProfileModal').classList.remove('active'); }

        function switchTab(tab) {
            document.querySelectorAll('.view-step').forEach(el => el.classList.add('hidden-view'));
            if(tab === 'home') document.getElementById('homeMainView').classList.remove('hidden-view');
            else if(tab === 'messages') document.getElementById('messagesView').classList.remove('hidden-view');
        }
    </script>
</body>
</html>
