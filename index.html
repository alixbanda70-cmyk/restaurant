<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOMi - Futuristic Multi-Step Auth & Gold Card 2026</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #07090E;
            color: #FFFFFF;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 1. Aurora Background */
        .aurora-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #07090E 100%);
            filter: blur(40px);
        }

        /* 2. Full Screen App Container */
        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            max-width: 480px; /* يحافظ على مظهر الهاتف الحقيقي حتى في الشاشات الكبيرة */
            background: #0D1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        .border-beam {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0 300deg, #EF4444 320deg, #F59E0B 360deg);
            animation: rotateBeam 4s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        .card-container.clean-mode {
            background: #07090E !important;
        }

        .card-container.clean-mode .border-beam {
            display: none !important;
        }

        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(25px);
            padding: 24px 16px 80px 16px; /* ترك مساحة للشريط السفلي */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.05), transparent 40%);
            z-index: 3;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .logo-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #EF4444 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .subtitle {
            font-size: 13px;
            color: #9CA3AF;
            margin-top: 4px;
        }

        /* View Step Transitions */
        .view-step {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .hidden-view {
            display: none !important;
        }

        .active-view {
            display: flex;
            animation: viewEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Inputs */
        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 16px 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-box label {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .input-box input:focus,
        .input-box input:not(:placeholder-shown) {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.04);
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: 10px;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
        }

        .auth-error {
            color: #EF4444;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        /* Gender Grid */
        .gender-title, .step-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .gender-subtitle, .step-subtitle {
            text-align: center;
            font-size: 13px;
            color: #9CA3AF;
            margin-bottom: 20px;
        }

        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .gender-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gender-card .avatar { font-size: 42px; margin-bottom: 10px; display: block; }

        .gender-card.selected {
            background: rgba(239, 68, 68, 0.12);
            border-color: #EF4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .gender-card .checkmark {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #EF4444;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gender-card.selected .checkmark { opacity: 1; }

        /* Name Input */
        .name-field-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .name-input {
            width: 100%;
            padding: 20px 48px 20px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            outline: none;
        }

        .name-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }

        .status-check {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            color: #10B981;
            font-size: 20px;
            transition: transform 0.3s;
        }

        .name-field-wrapper.valid .status-check {
            transform: translateY(-50%) scale(1);
        }

        .counter-tag {
            text-align: left;
            font-size: 11px;
            color: #6B7280;
            margin-bottom: 20px;
            padding-left: 6px;
        }

        /* Date Picker */
        .date-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .date-select-wrapper select {
            width: 100%;
            padding: 14px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            text-align: center;
        }

        .date-select-wrapper select option {
            background: #0D1117;
            color: #FFFFFF;
        }

        .date-label {
            display: block;
            text-align: center;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .age-badge {
            text-align: center;
            margin-bottom: 16px;
            font-size: 12px;
            color: #10B981;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .age-badge.show { opacity: 1; }

        /* Avatar Upload */
        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-upload-zone {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(245, 158, 11, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .avatar-upload-zone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .upload-placeholder-content { text-align: center; pointer-events: none; }
        .upload-icon { font-size: 26px; margin-bottom: 4px; display: block; }
        .upload-text { font-size: 11px; color: #9CA3AF; font-weight: 700; }
        #avatarInput, #roomAvatarInput, #roomBgInput { display: none; }

        /* GOLD CARD UI */
        .gold-card-wrapper {
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .gold-id-card {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 18px;
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            padding: 18px;
            box-shadow: 0 15px 35px rgba(170, 119, 28, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-chip {
            width: 34px;
            height: 24px;
            background: linear-gradient(135deg, #E6C687 0%, #99742B 100%);
            border-radius: 5px;
        }

        .card-brand-tag {
            font-size: 13px;
            font-weight: 900;
            color: #382506;
            letter-spacing: 2px;
        }

        .card-body-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-avatar-box {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid #FFF;
            overflow: hidden;
            background: #222;
            flex-shrink: 0;
        }

        .card-avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        .card-name {
            font-size: 17px;
            font-weight: 900;
            color: #2b1c03;
        }

        .card-info-grid {
            font-size: 11px;
            color: #4a3307;
            font-weight: 700;
            margin-top: 3px;
        }

        .card-footer-row {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #5c4109;
            font-weight: 800;
            border-top: 1px solid rgba(110, 78, 13, 0.2);
            padding-top: 6px;
        }

        /* Magnetic Buttons */
        .btn-wrapper { position: relative; margin-top: 10px; width: 100%; }

        .magnetic-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .footer-tag { text-align: center; margin-top: 20px; font-size: 11px; color: #4B5563; }

        /* DASHBOARD STYLES */
        .create-room-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: #07090E;
            font-size: 15px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .welcome-banner {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
        }

        .welcome-banner h3 { font-size: 16px; color: #FFF; margin-bottom: 6px; }
        .welcome-banner p { font-size: 12px; color: #9CA3AF; }

        /* ROOM BACKGROUNDS */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .bg-option {
            height: 80px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }

        .bg-option.selected {
            border-color: #F59E0B;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        /* LIVE VOICE ROOM (10 MICS - FULLFIT CONTAINER) */
        .live-room-container {
            position: relative;
            width: 100%;
            flex: 1;
            border-radius: 20px;
            padding: 14px 10px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .live-room-header {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
        }

        .live-room-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #F59E0B;
        }

        .live-room-title {
            font-size: 13px;
            font-weight: 800;
            color: #FFF;
        }

        /* Mics Grid inside container */
        .mics-grid-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding-bottom: 10px;
        }

        .mics-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
        }

        .mic-seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 52px;
        }

        .mic-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #FFF;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .mic-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .mic-seat.occupied .mic-circle {
            border-color: #10B981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .mic-number {
            font-size: 10px;
            font-weight: 800;
            color: #E5E7EB;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* PROFILE VIEW */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .profile-img-large {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid #F59E0B;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            overflow: hidden;
            margin-bottom: 10px;
            background: #222;
        }

        .profile-img-large img { width: 100%; height: 100%; object-fit: cover; }

        .profile-display-name {
            font-size: 19px;
            font-weight: 900;
            color: #FFF;
            margin-bottom: 2px;
        }

        .profile-display-email {
            font-size: 12px;
            color: #9CA3AF;
            margin-bottom: 18px;
        }

        .profile-data-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .data-row:last-child { border-bottom: none; padding-bottom: 0; }
        .data-label { color: #9CA3AF; }
        .data-val { color: #F59E0B; font-weight: 800; }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            left
