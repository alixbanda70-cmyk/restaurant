<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOMi - Futuristic Multi-Step Auth 2026</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #07090E;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. Aurora Background */
        .aurora-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #07090E 100%);
            filter: blur(40px);
            animation: auroraMove 12s ease-in-out infinite alternate;
        }

        @keyframes auroraMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        /* 2. Glass Container & Border Beam */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            padding: 2px;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(239, 68, 68, 0.15);
            animation: springPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes springPop {
            0% { opacity: 0; transform: translateY(50px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .border-beam {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0 300deg, #EF4444 320deg, #F59E0B 360deg);
            animation: rotateBeam 4s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 26px;
            padding: 40px 30px;
            overflow: hidden;
        }

        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.08), transparent 40%);
            z-index: 3;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #EF4444 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .subtitle {
            font-size: 13px;
            color: #9CA3AF;
            margin-top: 6px;
        }

        /* View Step Transitions */
        .view-step {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden-view {
            display: none;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }

        .active-view {
            display: block;
            animation: viewEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Form Floating Inputs */
        .input-box {
            position: relative;
            margin-bottom: 22px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 16px 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-box label {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-box input:focus,
        .input-box input:not(:placeholder-shown) {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.04);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: 10px;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
        }

        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            opacity: 0.6;
        }

        /* Gender & Step Titles */
        .gender-title, .step-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .gender-subtitle, .step-subtitle {
            text-align: center;
            font-size: 13px;
            color: #9CA3AF;
            margin-bottom: 24px;
        }

        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .gender-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }

        .gender-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .gender-card .avatar { font-size: 42px; margin-bottom: 10px; display: block; }

        .gender-card.selected {
            background: rgba(239, 68, 68, 0.12);
            border-color: #EF4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
            transform: scale(1.04);
        }

        .gender-card .checkmark {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s;
        }

        .gender-card.selected .checkmark {
            opacity: 1;
            background: #EF4444;
            color: #FFF;
        }

        /* Name Input UI */
        .name-field-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .name-input {
            width: 100%;
            padding: 20px 48px 20px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .name-input:focus {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.05);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4), inset 0 -3px 0 #F59E0B;
        }

        .name-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }

        .status-check {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            color: #10B981;
            font-size: 20px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .name-field-wrapper.valid .status-check {
            transform: translateY(-50%) scale(1);
        }

        .counter-tag {
            text-align: left;
            font-size: 11px;
            color: #6B7280;
            margin-bottom: 24px;
            padding-left: 6px;
        }

        /* 4. DATE PICKER STEP UI & LIQUID GLASS DROPDOWNS */
        .date-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .date-select-wrapper {
            position: relative;
        }

        .date-select-wrapper select {
            width: 100%;
            padding: 16px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .date-select-wrapper select option {
            background: #0D1117;
            color: #FFFFFF;
            padding: 10px;
        }

        .date-select-wrapper select:focus {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.08);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
        }

        .date-label {
            display: block;
            text-align: center;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .date-icon-tag {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 10px;
            color: #6B7280;
        }

        .age-badge {
            text-align: center;
            margin-bottom: 20px;
            font-size: 12px;
            color: #10B981;
            font-weight: 700;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .age-badge.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Shake Error Animation */
        .shake {
            animation: shakeAnim 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Magnetic Buttons */
        .btn-wrapper { position: relative; margin-top: 10px; }

        .magnetic-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
        }

        .magnetic-btn:hover {
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6), 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .ripple-wave {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .footer-tag { text-align: center; margin-top: 22px; font-size: 12px; color: #4B5563; }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="card-container">
        <div class="border-beam"></div>

        <div class="glass-card" id="card">
            <div class="spotlight" id="spotlight"></div>

            <div class="brand">
                <div class="logo-title">SIMOMi</div>
                <div class="subtitle">AI Voice Hub • 2026 Edition</div>
            </div>

            <!-- STEP 1: Login View -->
            <div id="loginView" class="view-step active-view">
                <form onsubmit="handleLoginSubmit(event)">
                    <div class="input-box">
                        <input type="email" id="email" placeholder=" " required autocomplete="off">
                        <label for="email">البريد الإلكتروني</label>
                    </div>

                    <div class="input-box">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">كلمة المرور</label>
                        <span class="password-toggle" onclick="togglePassword()">👁️</span>
                    </div>

                    <div class="btn-wrapper">
                        <button type="submit" class="magnetic-btn mag-btn">
                            تسجيل الدخول
                        </button>
                    </div>
                </form>
            </div>

            <!-- STEP 2: Gender Selection View -->
            <div id="genderView" class="view-step hidden-view">
                <div class="gender-title">تحديد الهوية</div>
                <div class="gender-subtitle">اختر جنسك لمتابعة إعداد حسابك الصوتي</div>

                <div class="gender-grid">
                    <div class="gender-card" id="cardMale" onclick="selectGender('male')">
                        <div class="checkmark">✓</div>
                        <span class="avatar">👦</span>
                        <div class="gender-label">ولد</div>
                    </div>

                    <div class="gender-card" id="cardFemale" onclick="selectGender('female')">
                        <div class="checkmark">✓</div>
                        <span class="avatar">👧</span>
                        <div class="gender-label">بنت</div>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <button type="button" class="magnetic-btn mag-btn" onclick="goToNameStep()">
                        متابعة
                    </button>
                </div>
            </div>

            <!-- STEP 3: Name Input View -->
            <div id="nameView" class="view-step hidden-view">
                <div class="step-title">ما هو اسمك؟</div>
                <div class="step-subtitle">سيظهر هذا الاسم لأصدقائك في الغرف الصوتية</div>

                <div class="name-field-wrapper" id="nameWrapper">
                    <span class="name-icon">👤</span>
                    <input 
                        type="text" 
                        id="userName" 
                        class="name-input" 
                        placeholder="اكتب اسمك هنا..." 
                        maxlength="20"
                        autocomplete="off"
                        oninput="validateNameInput()"
                    >
                    <span class="status-check">✓</span>
                </div>

                <div class="counter-tag">
                    <span id="charCount">0</span>/20 حرف
                </div>

                <div class="btn-wrapper">
                    <button type="button" class="magnetic-btn mag-btn" onclick="goToDateStep()">
                        متابعة
                    </button>
                </div>
            </div>

            <!-- STEP 4: Date of Birth View -->
            <div id="dateView" class="view-step hidden-view">
                <div class="step-title">تاريخ الميلاد 🎂</div>
                <div class="step-subtitle">حدد تاريخ ميلادك لتخصيص تجربتك</div>

                <div class="date-picker-grid" id="dateGrid">
                    <!-- Day Dropdown -->
                    <div class="date-select-wrapper">
                        <span class="date-label">اليوم</span>
                        <select id="dobDay" onchange="calculateAge()">
                            <option value="">اليوم</option>
                        </select>
                        <span class="date-icon-tag">▼</span>
                    </div>

                    <!-- Month Dropdown -->
                    <div class="date-select-wrapper">
                        <span class="date-label">الشهر</span>
                        <select id="dobMonth" onchange="calculateAge()">
                            <option value="">الشهر</option>
                        </select>
                        <span class="date-icon-tag">▼</span>
                    </div>

                    <!-- Year Dropdown -->
                    <div class="date-select-wrapper">
                        <span class="date-label">السنة</span>
                        <select id="dobYear" onchange="calculateAge()">
                            <option value="">السنة</option>
                        </select>
                        <span class="date-icon-tag">▼</span>
                    </div>
                </div>

                <div class="age-badge" id="ageBadge">
                    🎉 العمر الحسابي: <span id="calculatedAge">0</span> سنة
                </div>

                <div class="btn-wrapper">
                    <button type="button" class="magnetic-btn mag-btn" onclick="finishProfile()">
                        انضم إلى SIMOMi 🚀
                    </button>
                </div>
            </div>

            <div class="footer-tag">
                🔒 نظام محمي بتشفير AI الذكي
            </div>

        </div>
    </div>

    <script>
        let selectedGenderValue = null;

        // Mouse Spotlight
        const card = document.getElementById('card');
        const spotlight = document.getElementById('spotlight');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            spotlight.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            spotlight.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // Magnetic Buttons & Ripple
        document.querySelectorAll('.mag-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                btn.style.transform = `translate(${(e.clientX - rect.left - rect.width/2) * 0.2}px, ${(e.clientY - rect.top - rect.height/2) * 0.2}px)`;
            });
            btn.addEventListener('mouseleave', () => btn.style.transform = 'translate(0px, 0px)');
            
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const circle = document.createElement('span');
                const diameter = Math.max(rect.width, rect.height);
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - diameter/2}px`;
                circle.style.top = `${e.clientY - rect.top - diameter/2}px`;
                circle.classList.add('ripple-wave');
                if (this.querySelector('.ripple-wave')) this.querySelector('.ripple-wave').remove();
                this.appendChild(circle);
            });
        });

        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // View Switcher Helper
        function switchView(fromId, toId) {
            const fromView = document.getElementById(fromId);
            const toView = document.getElementById(toId);

            fromView.style.opacity = '0';
            fromView.style.transform = 'scale(0.9) translateY(-20px)';

            setTimeout(() => {
                fromView.classList.remove('active-view');
                fromView.classList.add('hidden-view');

                toView.classList.remove('hidden-view');
                toView.classList.add('active-view');
            }, 350);
        }

        // Step 1 -> Step 2
        function handleLoginSubmit(e) {
            e.preventDefault();
            switchView('loginView', 'genderView');
        }

        // Gender Selection Physics
        function selectGender(gender) {
            selectedGenderValue = gender;
            document.getElementById('cardMale').classList.toggle('selected', gender === 'male');
            document.getElementById('cardFemale').classList.toggle('selected', gender === 'female');
        }

        // Step 2 -> Step 3
        function goToNameStep() {
            if (!selectedGenderValue) {
                alert('المرجو اختيار الجنس أولاً (ولد أو بنت)');
                return;
            }
            switchView('genderView', 'nameView');
            setTimeout(() => document.getElementById('userName').focus(), 400);
        }

        // Step 3 Input Validation & Counter
        function validateNameInput() {
            const input = document.getElementById('userName');
            const wrapper = document.getElementById('nameWrapper');
            const counter = document.getElementById('charCount');
            const val = input.value.trim();

            counter.innerText = input.value.length;
            if (val.length >= 3) {
                wrapper.classList.add('valid');
            } else {
                wrapper.classList.remove('valid');
            }
        }

        // Step 3 -> Step 4
        function goToDateStep() {
            const input = document.getElementById('userName');
            const wrapper = document.getElementById('nameWrapper');
            if (input.value.trim().length < 3) {
                wrapper.classList.add('shake');
                setTimeout(() => wrapper.classList.remove('shake'), 500);
                return;
            }
            populateDateSelects();
            switchView('nameView', 'dateView');
        }

        // Step 4 Populate Dropdowns
        function populateDateSelects() {
            const daySel = document.getElementById('dobDay');
            const monthSel = document.getElementById('dobMonth');
            const yearSel = document.getElementById('dobYear');

            if (daySel.options.length > 1) return; // Prevent duplicating

            // Populate Days (1-31)
            for (let i = 1; i <= 31; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = i;
                daySel.appendChild(opt);
            }

            // Populate Months
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'ماي', 'يونيو', 'يوليو', 'غشت', 'شتنبر', 'أكتوبر', 'نونبر', 'دجنبر'];
            months.forEach((m, idx) => {
                let opt = document.createElement('option');
                opt.value = idx + 1;
                opt.innerText = m;
                monthSel.appendChild(opt);
            });

            // Populate Years (1950 - Current Year)
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1950; y--) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.innerText = y;
                yearSel.appendChild(opt);
            }
        }

        // Age Calculation & Display
        function calculateAge() {
            const day = document.getElementById('dobDay').value;
            const month = document.getElementById('dobMonth').value;
            const year = document.getElementById('dobYear').value;
            const badge = document.getElementById('ageBadge');
            const ageSpan = document.getElementById('calculatedAge');

            if (day && month && year) {
                const birthDate = new Date(year, month - 1, day);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                ageSpan.innerText = age;
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }
        }

        // Final Submit
        function finishProfile() {
            const day = document.getElementById('dobDay').value;
            const month = document.getElementById('dobMonth').value;
            const year = document.getElementById('dobYear').value;
            const dateGrid = document.getElementById('dateGrid');

            if (!day || !month || !year) {
                dateGrid.classList.add('shake');
                setTimeout(() => dateGrid.classList.remove('shake'), 500);
                return;
            }

            const nameVal = document.getElementById('userName').value.trim();
            const genderText = selectedGenderValue === 'male' ? 'ولد 👦' : 'بنت 👧';
            const ageText = document.getElementById('calculatedAge').innerText;

            alert(`🎉 مرحباً بك يا ${nameVal} فـ SIMOMi!\nالهوية: ${genderText}\nتاريخ الميلاد: ${day}/${month}/${year} (${ageText} سنة)`);
        }
    </script>
</body>
</html>
