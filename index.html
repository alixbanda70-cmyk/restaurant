<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOMi - Futuristic Login 2026</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #07090E;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. Aurora & Mesh Gradient Background */
        .aurora-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #07090E 100%);
            filter: blur(40px);
            animation: auroraMove 12s ease-in-out infinite alternate;
        }

        @keyframes auroraMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        /* 2. Liquid Glass Card Container & Stagger Entrance */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 2px; /* For Border Beam */
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(239, 68, 68, 0.15);
            animation: springPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes springPop {
            0% { opacity: 0; transform: translateY(50px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 3. Animated Border Beam Effect */
        .border-beam {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0 300deg, #EF4444 320deg, #F59E0B 360deg);
            animation: rotateBeam 4s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 4. Glassmorphism & Spotlight Inner Card */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 26px;
            padding: 40px 32px;
            overflow: hidden;
        }

        /* Mouse Spotlight Effect */
        .spotlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.08), transparent 40%);
            z-index: 3;
        }

        /* Branding & Titles */
        .stagger-item {
            opacity: 0;
            transform: translateY(20px);
            animation: staggerFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 { animation-delay: 0.2s; }
        .stagger-2 { animation-delay: 0.3s; }
        .stagger-3 { animation-delay: 0.4s; }
        .stagger-4 { animation-delay: 0.5s; }

        @keyframes staggerFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-title {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #EF4444 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .subtitle {
            font-size: 13px;
            color: #9CA3AF;
            margin-top: 6px;
        }

        /* 5. Animated Floating Labels & Inputs with Focus Glow */
        .input-box {
            position: relative;
            margin-bottom: 24px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 16px 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-box label {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Focus & Floating Label Active States */
        .input-box input:focus,
        .input-box input:not(:placeholder-shown) {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.04);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: 10px;
            font-size: 11px;
            color: #F59E0B;
            font-weight: 700;
        }

        /* Password Reveal Toggle */
        .password-toggle {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .password-toggle:hover { opacity: 1; }

        /* 6. Magnetic Button with 3D Press & Ripple */
        .btn-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .magnetic-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
        }

        .magnetic-btn:hover {
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6), 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .magnetic-btn:active {
            transform: scale(0.96) translateY(2px) !important;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        /* Ripple Wave Effect */
        .ripple-wave {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        .footer-tag {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #4B5563;
        }
    </style>
</head>
<body>

    <!-- Aurora Background -->
    <div class="aurora-bg"></div>

    <!-- Main Card -->
    <div class="card-container">
        <!-- Border Beam Anim -->
        <div class="border-beam"></div>

        <!-- Glass Content Card -->
        <div class="glass-card" id="card">
            <div class="spotlight" id="spotlight"></div>

            <div class="brand stagger-item stagger-1">
                <div class="logo-title">SIMOMi</div>
                <div class="subtitle">AI Voice Hub • 2026 Edition</div>
            </div>

            <form id="loginForm" onsubmit="handleSubmit(event)">
                
                <!-- Email Input -->
                <div class="input-box stagger-item stagger-2">
                    <input type="email" id="email" placeholder=" " required autocomplete="off">
                    <label for="email">البريد الإلكتروني</label>
                </div>

                <!-- Password Input + Reveal -->
                <div class="input-box stagger-item stagger-3">
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password">كلمة المرور</label>
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>

                <!-- Magnetic Button -->
                <div class="btn-wrapper stagger-item stagger-4">
                    <button type="submit" class="magnetic-btn" id="magBtn">
                        تسجيل الدخول
                    </button>
                </div>

            </form>

            <div class="footer-tag stagger-item stagger-4">
                🔒 نظام محمي بتشفير AI الذكي
            </div>

        </div>
    </div>

    <script>
        // 1. Mouse Spotlight Tracking
        const card = document.getElementById('card');
        const spotlight = document.getElementById('spotlight');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            spotlight.style.setProperty('--mouse-x', `${x}px`);
            spotlight.style.setProperty('--mouse-y', `${y}px`);
        });

        // 2. Magnetic Button Effect
        const btn = document.getElementById('magBtn');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.transform = 'translate(0px, 0px)';
        });

        // 3. Ripple Effect on Click
        btn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const circle = document.createElement('span');
            const diameter = Math.max(rect.width, rect.height);
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - diameter / 2}px`;
            circle.style.top = `${e.clientY - rect.top - diameter / 2}px`;
            circle.classList.add('ripple-wave');

            const ripple = this.getElementsByClassName('ripple-wave')[0];
            if (ripple) ripple.remove();

            this.appendChild(circle);
        });

        // 4. Password Reveal Toggle
        function togglePassword() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        // 5. Submit Micro-interaction
        function handleSubmit(e) {
            e.preventDefault();
            btn.innerText = 'جاري التحقق...';
            btn.style.opacity = '0.8';
            setTimeout(() => {
                alert('تم تسجيل الدخول بنجاح فـ SIMOMi!');
                btn.innerText = 'تسجيل الدخول';
                btn.style.opacity = '1';
            }, 1000);
        }
    </script>
</body>
</html>
